<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Shield and Building Icon Group with Shadow -->
  <g filter="url(#shadow)" transform="translate(64, 56)">
    <!-- Real Estate Towers / House outline -->
    <path d="M192 40 L300 130 L300 360 L84 360 L84 130 Z" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linejoin="round" />
    
    <!-- Central Tower Roof -->
    <polygon points="192,20 230,60 154,60" fill="url(#goldGrad)" />
    <rect x="160" y="60" width="64" height="300" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Left Tower -->
    <rect x="100" y="150" width="48" height="210" fill="url(#goldGrad)" opacity="0.75" />
    <polygon points="124,115 152,150 96,150" fill="url(#goldGrad)" opacity="0.75" />

    <!-- Right Tower -->
    <rect x="236" y="120" width="48" height="240" fill="url(#goldGrad)" opacity="0.75" />
    <polygon points="260,85 288,120 232,120" fill="url(#goldGrad)" opacity="0.75" />

    <!-- Windows in Central Tower -->
    <rect x="176" y="90" width="12" height="18" rx="2" fill="#1c1917" />
    <rect x="196" y="90" width="12" height="18" rx="2" fill="#1c1917" />
    <rect x="176" y="125" width="12" height="18" rx="2" fill="#1c1917" />
    <rect x="196" y="125" width="12" height="18" rx="2" fill="#1c1917" />
    <rect x="176" y="160" width="12" height="18" rx="2" fill="#1c1917" />
    <rect x="196" y="160" width="12" height="18" rx="2" fill="#1c1917" />
    <rect x="176" y="195" width="12" height="18" rx="2" fill="#1c1917" />
    <rect x="196" y="195" width="12" height="18" rx="2" fill="#1c1917" />

    <!-- Safe Lock Badge in Center symbolizing private client data -->
    <g transform="translate(142, 240)">
      <circle cx="50" cy="50" r="46" fill="#1c1917" stroke="url(#goldGrad)" stroke-width="8" />
      <!-- Lock Shackle -->
      <path d="M38 46 L38 34 C38 27.4 43.4 22 50 22 C56.6 22 62 27.4 62 34 L62 46" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
      <!-- Lock Body -->
      <rect x="30" y="46" width="40" height="30" rx="6" fill="url(#goldGrad)" />
      <circle cx="50" cy="58" r="4" fill="#1c1917" />
      <path d="M50 62 L50 68" stroke="#1c1917" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
</svg>
